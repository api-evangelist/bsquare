name: Bsquare
description: 'Bsquare is an IoT and edge-software company known for Windows IoT device licensing, OS
  consulting (Windows, Linux, Android), device management, and its DataV IoT analytics and SquareOne
  data platform. Bsquare was acquired by Kontron; the bsquare.com domain now 301-redirects to
  www.kontron-americas.com, and the Bsquare brand operates as part of Kontron''s connected-device
  software portfolio serving healthcare, avionics, energy, manufacturing, logistics, transportation,
  and hospitality. No independent public developer API or documentation surface is currently published;
  this profile carries the honest enrichment of the domain''s live security and DNS posture.'
